_config_version: 12
model:
  provider: copilot
  default: gpt-4.1
  context_length: 64000
  default_headers:
    Copilot-Integration-Id: copilot-developer
agent:
  max_turns: 8
  disabled_toolsets: [terminal, file, memory, skills, cronjob]
platform_toolsets:
  api_server: [web, delegation]
delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  max_iterations: 8
  inherit_mcp_toolsets: false
